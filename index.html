  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: #0f0f1a;
      color: #fff;
    }
    header {
      background: linear-gradient(90deg, #4b0082, #1e90ff);
      padding: 20px;
      text-align: center;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    nav {
      background: #1e1e2f;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 12px;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: #1e1e2f;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.03);
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .card-content {
      padding: 15px;
    }
    .card h3 {
      margin: 0;
      color: #1e90ff;
      font-size: 18px;
    }
    .date {
      font-size: 13px;
      color: #aaa;
      margin: 5px 0;
    }
    .important {
      border: 2px solid #ff4081;
    }
    .actions {
      margin-top: 10px;
    }
    .actions button {
      margin-right: 5px;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .add-form {
      margin: 20px;
      text-align: center;
    }
    .add-form input, .add-form textarea {
      margin: 5px;
      padding: 8px;
      width: 220px;
      border-radius: 5px;
      border: none;
    }
    .add-form button {
      padding: 8px 15px;
      background: #4b0082;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }
    footer {
      background: #1e1e2f;
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
